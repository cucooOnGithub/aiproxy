[project]
name = "aiproxy"
version = "0.1.0"
description = "Anonymizing reverse proxy for LLM APIs"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "cryptography>=42.0",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
# Image/PDF redaction. Needs the Tesseract binary installed separately.
media = [
    "pillow>=10.0",
    "pytesseract>=0.3.10",
    "pypdfium2>=4.30",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
aiproxy = "aiproxy.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aiproxy*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
