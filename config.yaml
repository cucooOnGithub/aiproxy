listen:
  host: 127.0.0.1
  port: 8088

upstreams:
  anthropic:
    base_url: https://api.anthropic.com   # overridden by env for the echo proof

llm:
  url: http://localhost:11434
  # Single model:  model: llama3.2:latest
  # Ensemble (union, higher recall): list models cheap-first.
  # 7B won't fit while OpenWhispr holds ~3.9GB VRAM; use two 3B models.
  models:
    - qwen2.5:3b-instruct
    - llama3.2:latest
  keep_alive: 0   # unload each model after its call so the ensemble fits

pipeline:
  - logger
  - secrets_regex
  - anonymizer

mode: fail_closed

secrets_regex:
  patterns: [EMAIL, APIKEY, IBAN, PHONE]

anonymizer:
  entities:
    PERSON: anonymize
    ORG: anonymize
    LOCATION: ignore
    EMAIL: anonymize
  allowlist: []
  denylist: []

store:
  backend: sqlite
  path: /tmp/claude-1000/-mnt-t7data-AI-projects-AI-projects-aiproxy/8820584a-ee81-43c2-be29-aa4b6819ca57/scratchpad/map.db
  encrypt: false
