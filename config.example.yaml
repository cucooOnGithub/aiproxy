# aiproxy configuration. Copy to config.yaml and edit.

listen:
  host: 127.0.0.1
  port: 8080

# Where redacted requests are forwarded. The proxy mimics each provider's
# API, so point your AI tool at http://127.0.0.1:8080 instead of these.
# Override any base_url without editing this file via env:
#   AIPROXY_UPSTREAM_ANTHROPIC=https://api.anthropic.com
#   AIPROXY_UPSTREAM_OPENAI=http://127.0.0.1:9000   # e.g. another proxy
# The env value wins; a provider named only in env is added automatically.
upstreams:
  anthropic:
    base_url: https://api.anthropic.com
  openai:
    base_url: https://api.openai.com

# Shared local-LLM used by anonymizer + image_redactor for NER.
llm:
  url: http://localhost:11434   # Ollama
  # Pick ONE of:
  #   model: llama3.2:latest        # single model
  #   models: [m1, m2]              # ensemble: union entities (higher recall,
  #                                 # latency = sum, may thrash GPU VRAM)
  model: qwen2.5:3b-instruct
  timeout: 60          # seconds per NER request (model-load counts here)
  warm_timeout: 300    # seconds allowed for the startup pre-warm cold load
  # keep_alive: 0      # unload model after each call; needed for an ensemble
                       # on a VRAM-tight GPU (else models thrash / OOM)
  cache_ttl: 3600      # seconds to keep in-memory NER results (null = forever);
                       # a reloaded model never re-runs NER on cached text
  # Entity types the model may return (also enum-constrains the JSON schema).
  # Add a custom type here AND give it an action under `anonymizer.entities`.
  entity_types: [PERSON, ORG, LOCATION, EMAIL, PHONE]
  # Override the NER prompt. MUST contain {text}; {types} is optional and is
  # filled from entity_types above. Default detects the standard PII types.
  # prompt: |
  #   You are a PII detector. Find every {types} in the text. Return JSON
  #   only. Copy the entity text exactly as it appears. Text:\n\n{text}

# Load the local model at startup so the first request doesn't hit the
# cold-load cost against `llm.timeout`. Set false to skip.
prewarm: true

# Ordered list of processors. Request path runs top->bottom;
# response path (restoration) runs bottom->top.
pipeline:
  - logger
  - secrets_regex
  - anonymizer
  - image_redactor

# fail_closed: block the send if a filter errors (never leak).
# fail_open:   send original content if a filter errors (risky).
mode: fail_closed

# What the redactors are allowed to touch. Claude's own operational content
# (the Claude Code system prompt, CLAUDE.md, skills, slash-command text,
# system reminders, local command output) must reach the model verbatim and
# is NEVER redacted; only genuine user messages and attached documents are.
scope:
  # false (default): the top-level `system` prompt passes through untouched.
  # true: also run redaction over the system prompt.
  redact_system: false
  # Any <tag>...</tag> region whose tag is listed here is protected wherever
  # it is injected inside a message, then restored verbatim before forwarding.
  skip_tags:
    - system-reminder
    - command-name
    - command-args
    - command-message
    - local-command-stdout
    - local-command-stderr
  # A whole text block is protected when its stripped text STARTS WITH any of
  # these. Catches operational blocks Claude Code injects untagged. Every
  # other block - all user AND assistant turns, plus documents - is redacted.
  skip_prefixes:
    - "# Environment"
    - "You are Claude Code"
    - "Direct output style is active"
    - "[SUGGESTION MODE"
  # Same, but protect the block when any of these regexes matches it
  # (re.search, DOTALL) - for operational blocks not pinned to the start.
  skip_regexes: []

secrets_regex:
  patterns: [EMAIL, APIKEY, IBAN, PHONE]

anonymizer:
  entities:
    PERSON: anonymize
    ORG: anonymize
    LOCATION: ignore
    EMAIL: anonymize
    PHONE: anonymize
  allowlist: []     # strings never redacted (e.g. your own company)
  denylist: []      # strings always redacted

image_redactor:
  max_pages: 20

store:
  backend: sqlite
  path: ./map.db
  encrypt: true     # requires env AIPROXY_STORE_KEY (python -m aiproxy genkey)

# Optional on-disk archive of REDACTED documents, keyed by a hash of the
# original. Doubles as a cache: re-presenting the same document reads the
# redacted version from here instead of re-running the local LLM / OCR.
# Only redacted output is written (never the original PII). Omit to disable.
# archive:
#   dir: ./redacted_archive

# Optional append-only JSONL debug log: one line per forwarded request
# recording WHAT was redacted - the post-redaction (token-bearing) message
# text, per-entity token counts, and attached document names/sizes. Never
# writes original PII (those stay encrypted in the store); use it to confirm
# the pipeline masks the right things. Omit to disable.
#
# debug: true ALSO writes the ORIGINAL message text in plaintext next to the
# redacted version (messages only; documents stay name-only) so you can see
# each original<->redacted pair. This puts real PII on disk unencrypted -
# leave it false except in a trusted debugging environment.
# redaction_log:
#   path: ./redacted_archive/redaction_log.jsonl
#   debug: false
